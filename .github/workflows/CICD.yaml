 name: CICD pipeline

 on:
   push:
     branches:
       - main

  permissions:
    id-token: write
    contents: read

  jobs:
    source-code-validation:
     runs-on: ubuntu-latest

     steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: java installation
        uses: actions/setup-java2V4
        with:
          version: '17'
          distribution: 'temurin'

      - name: sonarqube scan
        uses: sonarsource/sonarqube-scan-actions@8.4.1

    container-validation:
     runs-on: ubuntu-latest
     needs: source-code-validation

     steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: docker build
        run: docker build -t aditya:latest .

      - name: Docker image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: aditya:latest
          servity: HIGH, CRITICAL

    Infrastructure-code-validation:
      runs-on: ubuntu-latest
      needs: container-validation

      steps:
        - name: checkoutcode
          uses: actions/checkout@v4

        - name: Terraform Installation
          uses: hashicorp/setup-terraform@v2
          with:
           version: '1.13.0'

        - name: azure login
          run: azure/login@v4
          with:
           client-id: ${{secret.CLIENT_ID}}
           subscription-id:
           tanent-id:

        - name: Terraform init
          run: terraform init
          working-directory: ./Terraform/environment/dev

        - name: terraform validate
          run: terraform validate
          working-directory: 





      


    
   

